<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Harness Lab{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">HL</span>
        Harness Lab
      </a>
      <nav aria-label="Navegação principal">
        <a href="/">Valor</a>
        <a href="/workspace/agents">Agentes</a>
        <a href="/cases">Cases</a>
        <a href="/connections">Conexões</a>
        <a href="/rounds">Rodadas</a>
      </nav>
    </header>
    <main id="main-content" class="{% block main_class %}page-shell{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
